# Production Docker Compose configuration for CEOP.
#
# ─── 実運用との関係（重要） ──────────────────────────────────────────────
# 本番（ceop.mirai-dx-platform.com）は現在 `docker run` で起動されており、
# compose 管理下にはない。`docker inspect ceop-platform` の Labels に
# `com.docker.compose.*` が存在しないことで確認できる。
#
# そのため `docker compose -f docker-compose.prod.yml stop` などは
# 「一致するコンテナが無い」として静かに no-op で終わる。実機を止めたり
# 更新したりはしない。実運用手順は docs/operations/RUNBOOK.md を正とする。
#
# 本ファイルは、実運用中のコンテナと**同一のトポロジ**を再現するよう
# 合わせてある（container_name / bind mount / listen アドレス / ポート）。
# これにより、将来 compose へ切り替える際の差分をゼロにできる。切替手順は
# RUNBOOK.md「6. compose への切替」を参照。
#
# ─── 必須環境変数 ────────────────────────────────────────────────────
#   CEOP_JWT_SECRET   — 32 バイト以上のランダム値（`openssl rand -hex 32`）
#   CEOP_DATA_DIR     — ホスト側の SQLite データディレクトリ（絶対パス）
#                       本番では /home/kensan/.ceop/data
#   CEOP_IMAGE        — 使用するイメージタグ（例: ceop-platform:v0.6.2）
#
# いずれも `:?` 付きで参照しており、未設定なら compose は起動せずエラーで
# 停止する。既定値を与えると「空の DB を持つ 2 台目」が黙って立ち上がる
# 事故につながるため、意図的にフェイルファストにしている。
#
# ─── 任意 ────────────────────────────────────────────────────────────
#   CEOP_HOST_PORT    — ホスト側ポート（既定 3120。loopback のみに bind）
#   CEOP_SEED_DEMO    — "true" で初回起動時にデモ組織/ユーザーを投入
#   CEOP_CORS_ORIGIN  — ブラウザクライアント向けの許可オリジン
#
# 使い方:
#   CEOP_DATA_DIR=/home/kensan/.ceop/data CEOP_IMAGE=ceop-platform:v0.6.2 \
#     docker compose -f docker-compose.prod.yml --env-file /home/kensan/.ceop/.env up -d

services:
  ceop-platform:
    # `build:` は意図的に置かない。production で `docker compose up` が
    # 暗黙にローカルソースからビルドし、検証済みイメージと異なるものが
    # 起動する事故を防ぐ。イメージは release ワークフローの成果物を使う。
    image: "${CEOP_IMAGE:?CEOP_IMAGE を明示すること（例: ceop-platform:v0.6.2）。latest は使わない}"
    container_name: ceop-platform
    restart: unless-stopped

    # 公開は Cloudflare Tunnel（cloudflared-ceop.service）が担う。
    # コンテナを 0.0.0.0 で公開すると Tunnel を迂回した LAN 直アクセスが
    # 可能になり、Cloudflare 側のアクセス制御が効かなくなる。loopback 固定。
    ports:
      - "127.0.0.1:${CEOP_HOST_PORT:-3120}:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      # 未設定ならアプリが起動を拒否する。
      CEOP_JWT_SECRET: "${CEOP_JWT_SECRET:?CEOP_JWT_SECRET が未設定}"
      CEOP_SQLITE_FILE: /data/ceop.db
      # 新規 DB を用意するときだけ "true"。
      CEOP_SEED_DEMO: "${CEOP_SEED_DEMO:-false}"
      # production では常に無効。明示的な no-op として残す。
      CEOP_LOG_DEMO_CREDS: "false"
      CEOP_CORS_ORIGIN: "${CEOP_CORS_ORIGIN:-}"

    volumes:
      # named volume ではなく bind mount。実運用が bind mount であり、
      # named volume にすると「空の DB を持つ別インスタンス」が起動して
      # しまう。パスは必ず明示させる。
      - "${CEOP_DATA_DIR:?CEOP_DATA_DIR を明示すること（本番: /home/kensan/.ceop/data）}:/data"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # ─── ハードニング ──────────────────────────────────────────────
    # 2026-08-07 に v0.6.2 イメージで実機検証済み。この構成で起動し、
    # SQLite を読み、/health/ready が 200 を返すことを確認している。
    # アプリは /data（bind mount）以外に書き込まないため rootfs は読取専用に
    # できる。Node が使う /tmp だけ tmpfs で与える。
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # 単一ホスト同居構成のため、暴走時に他サービスを巻き込まないよう上限を置く。
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          # compose は `pids_limit` を deploy.resources.limits.pids へ正規化する。
          # 片方だけ書くと両者が食い違って `invalid compose project` になるため、
          # 同じ値を両方に置く。
          pids: 128
        reservations:
          memory: 64M
    pids_limit: 128

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── P4 監視スタック（profile: monitoring）────────────────────────────
  # 既定では起動しない。`--profile monitoring` を付けたときだけ Prometheus +
  # Grafana が loopback に bind される。実機の Tunnel は /metrics を公開しない
  # ingress 分割を推奨（RUNBOOK 参照）。
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: ceop-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    # CEOP API は 127.0.0.1:3120 にしか bind していないため、コンテナから
    # 到達するには host ネットワークが必要。listen は loopback のみに限定する。
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.listen-address=127.0.0.1:19090
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # CEOP /metrics の Bearer トークン（.env の CEOP_METRICS_TOKEN と同一・
      # chmod 600 で配置。Git には保存しない）
      - /home/kensan/.ceop/ceop-metrics-token:/secrets/ceop-metrics-token:ro
      - ceop-prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: ceop-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: "127.0.0.1"
      GF_SERVER_HTTP_PORT: "13001"
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD を設定（loopback 限定だが必須）}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ceop-grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ceop-prometheus-data:
  ceop-grafana-data:
