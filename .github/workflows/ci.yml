name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  # Dependency advisories are published independently of our commits, so a
  # push-only trigger detects them late. Run the security job daily at
  # 21:00 UTC (06:00 JST); the other jobs are skipped on this trigger.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── Job 1: Type-check, lint, and test ───────────────────────────────────────
  test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    # Scheduled runs only exercise the dependency audit; source has not changed.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: OpenAPI drift check
        run: pnpm run openapi:check

      - name: Test (with coverage)
        run: |
          set -eo pipefail
          pnpm run test \
            --experimental-test-coverage \
            --test-reporter=tap \
            --test-reporter-destination=stdout \
            2>&1 | tee test-results.txt
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: test-results.txt
          retention-days: 14

  # ── Job 2: TypeScript build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Integration smoke test
        run: node --experimental-strip-types examples/quickstart.ts

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: dist/
          retention-days: 7

  # ── Job 3: Dependency / security audit ──────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (pnpm audit)
        run: pnpm audit --audit-level=high

      - name: Scan for hardcoded secrets
        run: |
          if grep -rE '(password|secret|token)\s*=\s*["'"'"'][^"'"'"'\$\{][^"'"'"']{3,}' src/; then
            echo "FAIL: potential hardcoded secret detected"
            exit 1
          fi
          echo "OK: no hardcoded secrets found"

  # ── Job 4: Docker image build ────────────────────────────────────────────────
  # Only runs on direct push to main to avoid consuming Actions minutes on every PR.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: construction-eop:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
