name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
  # Dependency advisories are published independently of our commits, so a
  # push-only trigger detects them late. Run the security job daily at
  # 21:00 UTC (06:00 JST); the other jobs are skipped on this trigger.
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── Job 1: Type-check, lint, and test ───────────────────────────────────────
  test:
    name: Typecheck / Lint / Test
    runs-on: ubuntu-latest
    # Scheduled runs only exercise the dependency audit; source has not changed.
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: OpenAPI drift check
        run: pnpm run openapi:check

      - name: Parity check (feature inventory vs implementation)
        run: pnpm run parity

      - name: Test (with coverage)
        run: |
          set -eo pipefail
          mkdir -p coverage
          pnpm run test \
            --experimental-test-coverage \
            --test-coverage-lines=70 \
            --test-coverage-branches=60 \
            --test-coverage-functions=70 \
            --test-reporter=tap \
            --test-reporter-destination=stdout \
            --test-reporter=lcov \
            --test-reporter-destination=coverage/lcov.info \
            2>&1 | tee test-results.txt
        continue-on-error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: |
            test-results.txt
            coverage/lcov.info
          retention-days: 14

  # ── Job 2: TypeScript build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Integration smoke test
        run: node --experimental-strip-types examples/quickstart.ts

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.run_number }}
          path: dist/
          retention-days: 7

  # ── Job 3: Dependency / security audit ──────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (pnpm audit)
        run: pnpm audit --audit-level=high

      # Repository Actions settings allow only selected actions, so the
      # official gitleaks action cannot be used. Run the pinned binary instead
      # and verify its checksum before scanning the working tree.
      - name: Gitleaks secret scan
        run: |
          GITLEAKS_VERSION="8.30.1"
          cd /tmp
          curl -sfSL -o "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sfSL -o gitleaks.checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks.checksums.txt | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks detect --source="${GITHUB_WORKSPACE}" --config="${GITHUB_WORKSPACE}/.gitleaks.toml" --redact --verbose --no-git
        continue-on-error: false

      - name: Scan for hardcoded secrets (src/)
        run: |
          if grep -rE '(password|secret|token)\s*=\s*["'"'"'][^"'"'"'\$\{][^"'"'"']{3,}' src/; then
            echo "FAIL: potential hardcoded secret detected"
            exit 1
          fi
          echo "OK: no hardcoded secrets found"

  # ── Job 4: Browser E2E (Playwright) ─────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub-hosted ubuntu runners ship the Playwright browser deps; skip
      # --with-deps (apt-get) which stalls on some runners. Cache the browser
      # binary so installs are fast and deterministic.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: playwright-report/
          retention-days: 7

  # ── Job 4: Docker image build ────────────────────────────────────────────────
  # Runs on PRs and direct pushes to main. The central-auto-merge ruleset
  # requires this check on PRs; push: false keeps it a pure build validation.
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: construction-eop:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
