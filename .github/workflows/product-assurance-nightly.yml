name: Product Assurance Nightly

on:
  schedule:
    - cron: "30 18 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  assurance:
    name: Golden / Data / Resilience / AI / Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run deterministic assurance suites
        env:
          CEOP_TEST_EVIDENCE_FILE: artifacts/nightly-evidence.jsonl
          CEOP_TEST_ENVIRONMENT: github-nightly
        run: |
          mkdir -p artifacts
          pnpm run quality:merge
          pnpm run test:fuzz
          pnpm run test:performance
          pnpm run quality:evidence -- artifacts/nightly-evidence.jsonl artifacts/nightly-summary.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-assurance-${{ github.run_number }}
          path: artifacts/
          retention-days: 90

  browser:
    name: Browser / ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps ${{ (matrix.project == 'mobile-chrome' && 'chromium') || (matrix.project == 'mobile-safari' && 'webkit') || matrix.project }}
      - name: Run browser suite
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-browser-${{ matrix.project }}-${{ github.run_number }}
          path: playwright-report/
          retention-days: 14
