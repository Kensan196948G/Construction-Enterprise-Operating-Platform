[project]
name = "cdx-itsm-api"
version = "0.1.0"
description = "Construction DX ITSM & ZeroTrust Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.27",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "elasticsearch>=8.12.0",
    "pysnmp-lextudio>=5.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.8",
    "openai>=1.12.0",
    "azure-identity>=1.15.0",
    "msgraph-sdk>=1.0.0",
    "pgvector>=0.2.5",
    "PyJWT>=2.8.0",
    "cdx-shared-auth",
    "cdx-shared-db",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itsm_api"]

[tool.uv.sources]
cdx-shared-auth = { path = "../../../00_共通基盤/shared-auth", editable = true }
cdx-shared-db = { path = "../../../00_共通基盤/shared-db", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# Loop #32 / Issue #12 Step 2: practical ignore list to enable strict
# `ruff check .` (no `|| true`) without requiring a sweeping legacy refactor.
# Each rule is opt-out for a concrete reason:
# - B008 (function-call-in-default-arg): FastAPI Depends() / Query() / Body()
# - B904 (raise from): explicit context is sometimes intentionally omitted in
#   adapters that translate upstream errors verbatim.
# - B017 (assert-raises-exception): broad pytest.raises during early-stage tests
# - B905 (zip without strict): Python <3.10 compat in some adapters
# - SIM103/105/108/110/117/102: refactor suggestions (style), not bugs
# - N802/N806/N818: legacy/domain naming (日本語混在 / API contract names)
# - E741 (ambiguous variable name): domain-specific single-letter locals
# - F841 (unused variable): intentional placeholders during stub phases
# - UP042 (StrEnum) / UP046 (PEP 695 generics): py3.12 migration tracked separately
ignore = [
    "B008", "B904", "B017", "B905",
    "SIM102", "SIM103", "SIM105", "SIM108", "SIM110", "SIM117",
    "N802", "N806", "N818",
    "E741", "F841",
    "UP042", "UP046",
]
