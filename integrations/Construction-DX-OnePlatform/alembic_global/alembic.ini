; Construction DX One Platform — 全サブシステム統合 alembic.ini
;
; 本ファイルは「本番統合」用途で全サブプロジェクトのマイグレーションを
; 1つの version table (`alembic_version_global`) で一括管理する。
; 接続先は env.py が `DATABASE_URL` (もしくは cdx_db.config.DBSettings) から動的に決定する。
;
; 開発時は各サブプロジェクトの alembic.ini を従来どおり利用すること。

[alembic]
script_location = .
prepend_sys_path = .
version_locations = ./versions
version_path_separator = os
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

; env.py が上書きするのでダミー
sqlalchemy.url = postgresql+psycopg://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
