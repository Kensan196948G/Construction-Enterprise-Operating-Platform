name: e2e

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# 現状は skip-if-broken: 安定化までは continue-on-error
permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          # cache: 'npm' は package-lock.json が無いと失敗するため無効化

      - name: Install root workspaces
        run: npm install --no-fund --no-audit --legacy-peer-deps

      - name: Install e2e deps
        working-directory: e2e
        run: npm install --no-fund --no-audit

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps

      - name: Build & start docker compose stack (all 11 departments + mocks)
        run: |
          docker compose --profile mocks up -d \
            postgres redis elasticsearch minio mocks api-gateway \
            executive-api executive-web \
            crm-api crm-web \
            solution-api solution-web \
            construction-site-api construction-site-web \
            tech-api tech-web \
            safety-quality-api safety-quality-web \
            corp-api corp-web \
            proc-api proc-web \
            marine-api marine-web \
            itsm-api itsm-web \
            data-api data-web
        continue-on-error: true

      - name: Wait for services (best-effort)
        run: |
          for i in {1..30}; do
            if curl -fs http://localhost:8080/health >/dev/null 2>&1; then
              echo "api-gateway healthy"; break
            fi
            sleep 2
          done
        continue-on-error: true

      - name: Run Playwright tests
        working-directory: e2e
        env:
          E2E_GATEWAY_URL: http://localhost:8080
          E2E_MOCKS_URL: http://localhost:8090
          E2E_EXEC_URL: http://localhost:3013
          E2E_CRM_URL: http://localhost:3003
          E2E_SOL_URL: http://localhost:3004
          E2E_SITE_URL: http://localhost:3000
          E2E_TECH_URL: http://localhost:3005
          E2E_SQ_URL: http://localhost:3001
          E2E_CORP_URL: http://localhost:3007
          E2E_PROC_URL: http://localhost:3008
          E2E_MARINE_URL: http://localhost:3009
          E2E_ITSM_URL: http://localhost:3002
          E2E_DATA_URL: http://localhost:3011
        run: npm run e2e -- --project=chromium

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 14

      - name: Tear down
        if: always()
        run: docker compose down -v
        continue-on-error: true
