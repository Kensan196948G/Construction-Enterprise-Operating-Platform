name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '**/backend/**'
              - '00_共通基盤/shared-auth/**'
              - '00_共通基盤/shared-db/**'
              - '00_共通基盤/shared-pdf/**'
              - '00_共通基盤/api-gateway/**'
              - '.github/workflows/ci.yml'
            frontend:
              - '**/frontend/**'
              - '00_共通基盤/shared-ui/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.js'
              - '.github/workflows/ci.yml'
            shared:
              - '00_共通基盤/**'
              - '.github/workflows/ci.yml'

  backend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 00_共通基盤/shared-auth
          - 00_共通基盤/shared-db
          - 00_共通基盤/shared-pdf
          - 00_共通基盤/api-gateway
          - mocks
          - 01_経営企画部/ConstructionExecutiveDashboard/backend
          - 02_営業本部/ConstructionCRM-BidManagement/backend
          - 03_ソリューション営業本部/SmartInfrastructureSolutionPlatform/backend
          - 04_施工本部/ConstructionSiteManagementSystem/backend
          - 05_技術本部/TechnicalKnowledge-BIMPlatform/backend
          - 06_安全品質環境本部/SafetyQualityGovernancePlatform/backend
          - 07_管理本部/CorporateOperationPlatform/backend
          - 08_購買部/ProcurementMaterialPlatform/backend
          - 09_船舶事業部/MarineFleetManagement/backend
          - 10_IT-DX部門/ConstructionITSM-ZeroTrustPlatform/backend
          - 11_統合データ基盤/ConstructionDataLake-DigitalTwin/backend
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
      REDIS_HOST: localhost
      # Loop #21 / Issue #12: shared-auth's AuthSettings is evaluated during
      # pytest collection in some downstream tests (api-gateway, dept backends).
      # Provide harmless test stubs so `pytest --cov` (without `|| true`) can
      # surface real failures instead of being masked by env validation errors.
      ENTRA_TENANT_ID: test-tenant
      ENTRA_CLIENT_ID: test-client
      ENTRA_CLIENT_SECRET: test-secret
      JWT_AUDIENCE: test-audience
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tooling
        run: |
          python -m pip install -U pip
          pip install ruff pytest pytest-cov pytest-asyncio
      - name: Install shared modules (if dependent)
        run: |
          # 共通基盤系以外は shared-auth / shared-db を先に editable install
          case "${{ matrix.project }}" in
            00_共通基盤/shared-auth) ;;
            00_共通基盤/shared-db) ;;
            00_共通基盤/shared-pdf) ;;
            00_共通基盤/api-gateway)
              pip install -e "00_共通基盤/shared-auth"
              ;;
            *)
              pip install -e "00_共通基盤/shared-auth"
              pip install -e "00_共通基盤/shared-db"
              pip install -e "00_共通基盤/shared-pdf"
              ;;
          esac
      - name: Install project (editable + dev)
        working-directory: ${{ matrix.project }}
        run: |
          pip install -e ".[dev]" || pip install -e .
      - name: Lint (ruff)
        working-directory: ${{ matrix.project }}
        # Loop #32 / Issue #12 Step 2: removed `|| true` to gate real lint
        # failures. Each backend pyproject.toml has a documented [tool.ruff.lint]
        # ignore list (B008/B904/SIM*/N*/UP042 etc) to keep legacy patterns
        # such as FastAPI Depends() in default args from causing CI noise.
        run: ruff check .
      - name: Test (pytest)
        working-directory: ${{ matrix.project }}
        # Issue #12: removed `|| true` to surface real test failures. Loop #25
        # verified 16/16 backend projects pass after Loop #21 api-gateway fix (#11).
        # Note: `ruff check ... || true` (lint) intentionally retained; lint
        # hardening is tracked separately to avoid masking pytest signal.
        run: |
          if [ -d tests ]; then
            pytest --cov --cov-report=xml
          else
            echo "No tests/ in ${{ matrix.project }}; skipping."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-${{ strategy.job-index }}
          path: ${{ matrix.project }}/coverage.xml
          if-no-files-found: ignore

  frontend-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || needs.detect-changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 00_共通基盤/shared-ui
          - 01_経営企画部/ConstructionExecutiveDashboard/frontend
          - 02_営業本部/ConstructionCRM-BidManagement/frontend
          - 03_ソリューション営業本部/SmartInfrastructureSolutionPlatform/frontend
          - 04_施工本部/ConstructionSiteManagementSystem/frontend
          - 05_技術本部/TechnicalKnowledge-BIMPlatform/frontend
          - 06_安全品質環境本部/SafetyQualityGovernancePlatform/frontend
          - 07_管理本部/CorporateOperationPlatform/frontend
          - 08_購買部/ProcurementMaterialPlatform/frontend
          - 09_船舶事業部/MarineFleetManagement/frontend
          - 10_IT-DX部門/ConstructionITSM-ZeroTrustPlatform/frontend
          - 11_統合データ基盤/ConstructionDataLake-DigitalTwin/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install workspaces (root)
        run: |
          npm install --workspaces --include-workspace-root --legacy-peer-deps --no-audit --no-fund \
            || npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build shared-ui first
        run: npm -w @cdx/shared-ui run build --if-present || true
      - name: Typecheck (strict)
        working-directory: ${{ matrix.project }}
        # Loop #12: docker-build matrix で 25/25 緑化を確認後、typecheck を厳格化
        # (npm run typecheck を優先し、無ければ tsc --noEmit にフォールバック)
        run: npm run typecheck --if-present || npx tsc --noEmit
      - name: Lint (eslint v9 flat config — Issue #9 / Loop #29)
        working-directory: ${{ matrix.project }}
        # Loop #30: root eslint.config.js (typescript-eslint + react + react-hooks
        # + jsx-a11y) を使う。各 workspace の lint script は当面 warning 0 でなく
        # errors 0 を gate とする (react-hooks/exhaustive-deps 等の warning は
        # 別 Loop で実コード修正)。
        run: npm run lint --if-present
      - name: Test
        working-directory: ${{ matrix.project }}
        run: npm test --if-present -- --run || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.sarif
          if-no-files-found: ignore
