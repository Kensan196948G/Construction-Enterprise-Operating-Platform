---
# Construction DX One Platform — Zabbix Backend Templates
# Generated: Loop #36 (2026-06-01)
# Zabbix version: 6.4+
#
# 11 部門バックエンドサービス (port 8001-8011) + mocks (8090) + api-gateway (8080) を個別監視

zabbix_export:
  version: "6.4"
  date: "2026-06-01T18:00:00Z"

  templates:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # API Gateway — port 8080
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    - uuid: cdxgw00-0000-0000-0000-000000000001
      template: CDX API Gateway
      name: "CDX API Gateway (port 8080)"
      description: |
        API Gateway 監視。全部門バックエンドへのルーティング + JWT 検証 + Rate Limiting。
        X-Request-ID dedup (Loop #28 修正済) の監視を含む。
      groups:
        - name: "Construction DX / Infrastructure"
      macros:
        - macro: "{$CDX_PORT}"
          value: "8080"
        - macro: "{$CDX_HEALTH_PATH}"
          value: "/health"
        - macro: "{$GW_RATE_LIMIT_WARN}"
          value: "1000"
          description: "1分あたりのリクエスト数警告閾値"
      items:
        - uuid: cdxgw00-0001-0000-0000-000000000001
          name: "API Gateway — 5xx エラー率"
          type: HTTP_AGENT
          key: "cdx.gw.error5xx"
          url: "http://localhost:8080/metrics"
          value_type: FLOAT
          units: "%"
          delay: 30s
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$.http_server_requests_total[?(@.status=~/5.*/)]"
          description: "5xx エラー率 (%)"
          tags:
            - tag: component
              value: gateway
        - uuid: cdxgw00-0001-0000-0000-000000000002
          name: "API Gateway — X-Request-ID 重複数"
          type: HTTP_AGENT
          key: "cdx.gw.request_id_dup"
          url: "http://localhost:8080/metrics"
          value_type: UNSIGNED
          delay: 60s
          description: "X-Request-ID 重複カウント (0 が正常, Loop #28 dedup 修正)"
          tags:
            - tag: component
              value: gateway

