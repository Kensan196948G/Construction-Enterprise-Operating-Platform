# =========================================================
# Grafana data sources (Loop #9 — provisioning 自動化)
# =========================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: PostgreSQL-CDX
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${POSTGRES_DB:-construction_dx}
    user: ${POSTGRES_USER:-cdx_user}
    secureJsonData:
      password: ${POSTGRES_PASSWORD:-change_me}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: false

  - name: Elasticsearch-CDX
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: cdx-*
    jsonData:
      esVersion: "8.0+"
      timeField: "@timestamp"
    editable: false

  - name: Wazuh-Indexer
    type: elasticsearch
    access: proxy
    url: http://wazuh-indexer:9200
    database: wazuh-alerts-*
    jsonData:
      esVersion: "8.0+"
      timeField: "@timestamp"
    editable: false
