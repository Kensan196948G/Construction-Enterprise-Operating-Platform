name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"  # 毎週月曜日 04:00 UTC

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        # continue-on-error is scoped to this step only.
        # GitHub Advanced Security (GHAS) Code Scanning may not be enabled on this
        # repository; the SARIF upload then returns 403/404, which is an infra
        # limitation — not a code quality issue.  All other step failures (init,
        # autobuild, analysis itself) remain fatal so real issues are still caught.
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          upload: ${{ vars.GHAS_ENABLED == 'true' && 'always' || 'never' }}
