# Kafka Topics for Construction-Enterprise-OS
# Applied via: kubectl apply -f kafka-topics.yaml
# Or via Docker: kafka-topics.sh --create --topic <name> --partitions 3 --replication-factor 1
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: construction-enterprise-os.users
  namespace: construction-enterprise-os
  labels:
    strimzi.io/cluster: construction-enterprise-os-kafka
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000
    segment.bytes: 1073741824
---
