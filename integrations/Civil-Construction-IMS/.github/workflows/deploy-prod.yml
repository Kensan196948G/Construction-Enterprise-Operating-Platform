name: Deploy to Production

on:
  # Manual trigger only — do not auto-deploy on push to main.
  # Configure GitHub Secrets (AZURE_CLIENT_ID etc.) then trigger manually.
  workflow_dispatch:
    inputs:
      api_tag:
        description: 'API image tag to deploy (defaults to git SHA)'
        required: false
        type: string
      web_tag:
        description: 'Web image tag to deploy (defaults to git SHA)'
        required: false
        type: string

permissions:
  id-token: write # required for Azure OIDC Workload Identity Federation
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel an in-flight production deploy

env:
  NODE_VERSION: '22'
  REGISTRY: ${{ secrets.ACR_LOGIN_SERVER }}
  API_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/civil-ims-api
  WEB_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/civil-ims-web

jobs:
  # ------------------------------------------------------------------
  # 1. Build & push Docker images to ACR
  # ------------------------------------------------------------------
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Compute image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.api_tag }}
          GIT_SHA: ${{ github.sha }}
        run: |
          TAG="${INPUT_TAG:-$GIT_SHA}"
          echo "tag=${TAG::12}" >> "$GITHUB_OUTPUT"

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.API_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.API_IMAGE }}:buildcache,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.WEB_IMAGE }}:buildcache,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1

  # ------------------------------------------------------------------
  # 2. Run Prisma migrations against production DB
  # ------------------------------------------------------------------
  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter=api run db:generate

      - name: Run Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter=api run db:migrate:deploy

  # ------------------------------------------------------------------
  # 3. Deploy new image revisions to Azure Container Apps
  # ------------------------------------------------------------------
  deploy:
    name: Deploy Container Apps
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: production
    steps:
      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: civil-ims-prod-api
          imageToDeploy: ${{ env.API_IMAGE }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy Web Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: civil-ims-prod-web
          imageToDeploy: ${{ env.WEB_IMAGE }}:${{ needs.build-push.outputs.image_tag }}

      - name: Verify API health
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          API_URL="https://$(az containerapp show \
            --name civil-ims-prod-api \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}/api/v1/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ API healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Waiting for API... status=$STATUS (attempt $i/12)"
            sleep 10
          done
          echo "❌ API health check failed after 2 minutes"
          exit 1

      - name: Verify Web health
        env:
          AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
        run: |
          WEB_URL="https://$(az containerapp show \
            --name civil-ims-prod-web \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query 'properties.configuration.ingress.fqdn' -o tsv)"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WEB_URL}/api/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Web healthy (attempt $i)"
              exit 0
            fi
            echo "⏳ Waiting for Web... status=$STATUS (attempt $i/12)"
            sleep 10
          done
          echo "❌ Web health check failed after 2 minutes"
          exit 1

      - name: Deployment summary
        if: success()
        run: |
          echo "## 🚀 Production Deployment Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Component | Image Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-----------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| API | \`${{ needs.build-push.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Web | \`${{ needs.build-push.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
