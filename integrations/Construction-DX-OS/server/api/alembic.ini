# Alembic configuration for cdx-server
# Run from server/api/:  alembic upgrade head

[alembic]
script_location = migrations
prepend_sys_path = .

# DATABASE_URL must be set in the environment or passed via --url.
# Example: postgresql+psycopg2://cdx:secret@localhost/cdx
sqlalchemy.url = %(DATABASE_URL)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
