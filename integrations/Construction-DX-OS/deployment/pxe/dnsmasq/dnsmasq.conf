# Construction-DX-OS PXE Server — dnsmasq configuration
# Issue 0042 Phase 4.1
#
# Provides: DHCP + TFTP + PXE boot for BIOS and UEFI clients on the LAN.
# Deploy to: /etc/dnsmasq.d/cdx-pxe.conf (do NOT replace system dnsmasq.conf)
#
# Requirements:
#   apt install dnsmasq syslinux pxelinux ipxe

# ---------- DHCP ---------------------------------------------------------
# Serve DHCP only on the LAN interface (change to match your NIC name)
interface=eth0
# Do not forward DNS queries for .local to upstream
local=/local/
# DHCP range: hand out .100–.250, lease 12h
dhcp-range=192.168.0.100,192.168.0.250,255.255.255.0,12h
# Default gateway (change to your router IP)
dhcp-option=3,192.168.0.1
# DNS servers (change as needed)
dhcp-option=6,8.8.8.8,8.8.4.4

# ---------- TFTP ---------------------------------------------------------
enable-tftp
tftp-root=/srv/tftp

# ---------- PXE boot — dual BIOS/UEFI menu ------------------------------
#
# BIOS clients: send pxelinux.0
dhcp-boot=tag:!efi,pxelinux.0

# UEFI 32-bit (rare, Surface Pro 3 era)
dhcp-match=set:efi32,option:client-arch,6
dhcp-boot=tag:efi32,ipxe.efi

# UEFI 64-bit (standard modern hardware)
dhcp-match=set:efi64,option:client-arch,7
dhcp-boot=tag:efi64,ipxe.efi
dhcp-match=set:efi64,option:client-arch,9
dhcp-boot=tag:efi64,ipxe.efi

# After iPXE loads, chain to the iPXE HTTP boot script
# (prevents iPXE from re-requesting and looping)
dhcp-match=set:ipxe,175
dhcp-boot=tag:ipxe,http://192.168.0.185:8300/pxe/boot.ipxe

# ---------- TFTP option 66/67 fallback (legacy clients) ------------------
# option 66 = TFTP server name, option 67 = boot file name
dhcp-option=66,192.168.0.185
dhcp-option=67,pxelinux.0

# ---------- Logging ------------------------------------------------------
log-dhcp
log-queries
log-facility=/var/log/dnsmasq-pxe.log
