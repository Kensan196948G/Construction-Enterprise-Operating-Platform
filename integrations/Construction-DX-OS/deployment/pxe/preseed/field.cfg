#### Construction-DX-OS — Field Profile preseed
# Issue 0042 Phase 4.2
#
# Target: 現場作業員端末 (建設現場 LAN, Wi-Fi 接続)
# Optimized for low-bandwidth environments; minimal package set.

# --- Locale ---
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp
d-i time/zone string Asia/Tokyo
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# --- Network ---
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string cdx-field
d-i netcfg/get_domain string local

# --- Mirror ---
d-i mirror/country string JP
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# --- Account ---
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Field Worker
d-i passwd/username string cdxfield
d-i passwd/user-password-crypted password $6$rounds=500000$placeholder$CHANGEME_BEFORE_PRODUCTION

# --- Disk ---
d-i partman-auto/disk string /dev/sda
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# --- Packages (minimal for field use) ---
tasksel tasksel/first multiselect
d-i pkgsel/include string openssh-server curl wget gnupg2 ca-certificates

# --- Boot loader ---
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/sda

# --- Post-install ---
d-i preseed/late_command string \
    in-target /bin/bash -c ' \
        CDX_PROFILE="field"; \
        CDX_SERVER=$(cat /proc/cmdline | tr " " "\n" | grep "^cdx_server=" | cut -d= -f2-); \
        CDX_SERVER="${CDX_SERVER:-http://192.168.0.185:8300}"; \
        curl -fsSL "${CDX_SERVER}/pxe/agent-bootstrap.sh" \
            -o /tmp/agent-bootstrap.sh; \
        chmod +x /tmp/agent-bootstrap.sh; \
        CDX_PROFILE="${CDX_PROFILE}" \
        CDX_SERVER_URL="${CDX_SERVER}" \
        /tmp/agent-bootstrap.sh; \
    '

# --- Finish ---
d-i finish-install/reboot_in_progress note
