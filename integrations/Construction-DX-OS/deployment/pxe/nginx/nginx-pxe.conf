# Construction-DX-OS PXE HTTP distribution server — nginx configuration
# Issue 0042 Phase 4.1
#
# Serves:
#   /pxe/         — iPXE boot scripts (.ipxe)
#   /iso/         — ISO files with SHA256 sidecar (rate-limited)
#   /preseed/     — Debian preseed.cfg files (read-only, no listing)
#
# Deploy to: /etc/nginx/sites-available/cdx-pxe
# Enable:    ln -s /etc/nginx/sites-available/cdx-pxe /etc/nginx/sites-enabled/
#
# Requirements: apt install nginx

server {
    listen 80;
    server_name 192.168.0.185;

    # Disable directory listing globally
    autoindex off;

    # --- iPXE boot scripts (/pxe/) ---
    location /pxe/ {
        alias /srv/pxe/ipxe/;
        default_type text/plain;
        # Only allow .ipxe files
        location ~* \.(ipxe)$ {
            allow all;
        }
        location ~ {
            deny all;
        }
    }

    # --- ISO distribution (/iso/) ---
    # Rate-limited to prevent LAN saturation during mass deployment.
    # 100 MB/s per connection, max 10 simultaneous connections per IP.
    location /iso/ {
        alias /srv/pxe/iso/;

        # Bandwidth throttle: 100 MB/s per download
        limit_rate 100m;

        # Max simultaneous connections per client IP
        limit_conn addr 10;

        # Require exact filename match (SHA256 must be verified by client)
        # Only serve .iso and .sha256 files
        location ~* \.(iso|sha256)$ {
            allow all;
        }
        location ~ {
            deny all;
        }
    }

    # --- Preseed configs (/preseed/) ---
    # Served over plain HTTP (same-LAN assumption per Issue 0041 § 5.2)
    location /preseed/ {
        alias /srv/pxe/preseed/;
        # Only .cfg files
        location ~* \.cfg$ {
            allow all;
        }
        location ~ {
            deny all;
        }
    }

    # Block everything else
    location / {
        deny all;
    }

    # --- Access/error logs ---
    access_log /var/log/nginx/cdx-pxe-access.log combined;
    error_log  /var/log/nginx/cdx-pxe-error.log warn;
}

# --- Connection limit zone (must be in http {} context in nginx.conf) -------
# Add to /etc/nginx/nginx.conf inside http {} block:
#   limit_conn_zone $binary_remote_addr zone=addr:10m;
