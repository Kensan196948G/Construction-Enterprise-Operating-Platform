# Construction DX OS — nginx production configuration
#
# TLS termination + reverse proxy for cdx-server, Grafana, and Prometheus.
#
# Prerequisites:
#   - Place fullchain.pem and privkey.pem in ./deployment/nginx/certs/
#   - Set CDX_DOMAIN env var to your FQDN (used in docker-compose.prod.yml)
#
# Access paths:
#   https://<domain>/           → cdx-server (admin UI + API)
#   https://<domain>/grafana/   → Grafana dashboards (admin only)
#   https://<domain>/prometheus → Prometheus (restrict to internal IP or VPN)

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS main server
server {
    listen 443 ssl http2;
    server_name _;

    # TLS certificate (mount via docker volume from ./deployment/nginx/certs/)
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Modern TLS only
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # HSTS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers (CSP is set by cdx-server per-response — don't override here)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client body size (ISO builds can return large JSON with log data)
    client_max_body_size 10m;

    # --------------------------
    # cdx-server (main API + WebUI)
    # --------------------------
    location / {
        proxy_pass http://cdx-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE log streaming (no buffering)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SSE endpoint: disable buffering explicitly
    location ~ ^/api/v1/iso-builds/.+/log$ {
        proxy_pass http://cdx-server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1800s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------
    # Grafana dashboards
    # Restrict to internal network or VPN in production
    # --------------------------
    location /grafana/ {
        proxy_pass http://cdx-grafana:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------
    # Prometheus (admin only — restrict to trusted IPs in production)
    # --------------------------
    location /prometheus/ {
        # Uncomment and set to your admin subnet:
        # allow 10.0.0.0/8;
        # deny all;
        proxy_pass http://cdx-prometheus:9090/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
