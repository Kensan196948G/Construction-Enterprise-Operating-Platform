# Construction DX OS — Production Stack
#
# Use this file for production deployments.
# All internal services are NOT exposed to the host except via nginx (ports 80/443).
#
# Prerequisites:
#   1. Copy .env.example to .env.prod and fill ALL required variables
#   2. Place TLS cert/key at ./deployment/nginx/certs/{fullchain,privkey}.pem
#   3. docker compose -f docker-compose.prod.yml up -d
#
# Quick smoke-test after start:
#   curl -f https://<your-domain>/health

services:
  # --------------------------------------------------------------------------
  # nginx: TLS termination + reverse proxy (only service exposed to host)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: cdx-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deployment/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      cdx-server:
        condition: service_healthy
    networks:
      - cdx-internal
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # cdx-migrate: One-shot Alembic migration (exits 0 when done)
  # cdx-server waits for this to complete before starting.
  # --------------------------------------------------------------------------
  cdx-migrate:
    build:
      context: ./server/api
      dockerfile: Dockerfile
      args:
        INSTALL_OCR: "true"   # includes easyocr + pillow-heif (HEIC support)
    image: cdx-server:prod
    container_name: cdx-migrate
    restart: "no"
    command: >
      sh -c "alembic upgrade head && echo 'Migration complete'"
    environment:
      DATABASE_URL: "postgresql+psycopg2://cdx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres/cdx"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cdx-internal

  # --------------------------------------------------------------------------
  # cdx-server: Production FastAPI server (no mock worker)
  # --------------------------------------------------------------------------
  cdx-server:
    build:
      context: ./server/api
      dockerfile: Dockerfile
      args:
        INSTALL_OCR: "true"   # includes easyocr + pillow-heif (HEIC support)
    image: cdx-server:prod
    container_name: cdx-server
    restart: always
    expose:
      - "8000"
    environment:
      CDX_REGISTRATION_TOKEN: "${CDX_REGISTRATION_TOKEN:?CDX_REGISTRATION_TOKEN must be set}"
      CDX_ADMIN_PASSWORD: "${CDX_ADMIN_PASSWORD:?CDX_ADMIN_PASSWORD must be set}"
      CDX_BOOTSTRAP_SECRET: "${CDX_BOOTSTRAP_SECRET:?CDX_BOOTSTRAP_SECRET must be set}"
      DATABASE_URL: "postgresql+asyncpg://cdx:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres/cdx"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      CDX_RATE_LIMIT_ENABLED: "${CDX_RATE_LIMIT_ENABLED:-true}"
      CDX_WORKER_MOCK: "0"
      CDX_STORAGE_BACKEND: "postgres"
      # OIDC (optional — leave empty to skip OIDC auth)
      CDX_OIDC_ISSUER: "${CDX_OIDC_ISSUER:-}"
      CDX_OIDC_AUDIENCE: "${CDX_OIDC_AUDIENCE:-}"
      # Serial-scan OCR pipeline (GMSV0002 SMB → easyocr)
      # Set SERIAL_SCAN_MOCK=0 to enable real OCR; mount GMSV0002 on Docker host first.
      #   sudo mount -t cifs //GMSV0002/cdx-serial-scans /mnt/gmsv0002-serial \
      #     -o credentials=/etc/cdx-smb.creds,uid=1000,ro
      SERIAL_SCAN_MOCK: "${SERIAL_SCAN_MOCK:-1}"
      SERIAL_SCAN_PATH: "/mnt/gmsv0002-serial"
    volumes:
      # SMB share mounted on Docker host is bind-mounted read-only into container.
      # Host path /mnt/gmsv0002-serial must be mounted before docker compose up.
      - /mnt/gmsv0002-serial:/mnt/gmsv0002-serial:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cdx-migrate:
        condition: service_completed_successfully
    healthcheck:
      # Issue 0053: target /health/ready so Docker only marks the container
      # "healthy" when deep dependencies (storage + Redis) are reachable.
      # Use /health/live for liveness-style supervisors that must not flap on
      # transient DB outages.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - cdx-internal
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # --------------------------------------------------------------------------
  # postgres: Production database (not exposed to host)
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: cdx-postgres
    restart: always
    expose:
      - "5432"
    environment:
      POSTGRES_DB: cdx
      POSTGRES_USER: cdx
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdx"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cdx-internal
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # --------------------------------------------------------------------------
  # redis: Rate-limit backend (not exposed to host)
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cdx-redis
    restart: always
    expose:
      - "6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - cdx-internal

  # --------------------------------------------------------------------------
  # prometheus: Metrics (internal only — accessed via nginx /metrics proxy)
  # --------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: cdx-prometheus
    restart: always
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      cdx-server:
        condition: service_healthy
    networks:
      - cdx-internal

  # --------------------------------------------------------------------------
  # grafana: Dashboards (internal only — accessed via nginx /grafana proxy)
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: cdx-grafana
    restart: always
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: "${CDX_DOMAIN:?CDX_DOMAIN must be set}"
      GF_SERVER_ROOT_URL: "https://%(domain)s/grafana"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cdx-internal

volumes:
  postgres-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  cdx-internal:
    driver: bridge
    internal: false
