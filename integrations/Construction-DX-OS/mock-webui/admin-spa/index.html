<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>建設DX OS — 中央管理コンソール</title>
  <script src="vendor/react.min.js"></script>
  <script src="vendor/react-dom.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, 'Noto Sans JP', sans-serif; background: #f8fafc; overflow: hidden; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    code { font-family: 'SF Mono', 'Consolas', monospace; }
    table { border-spacing: 0; }
    button { font-family: inherit; }
    /* Mock environment badge — clarifies all data is dummy (Issue 0056) */
    #mock-badge {
      position: fixed; top: 8px; right: 10px; z-index: 9999;
      background: #f59e0b; color: #fff; font-size: 11px; font-weight: 700;
      padding: 4px 10px; border-radius: 6px; letter-spacing: 0.04em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2); pointer-events: none;
      font-family: system-ui, 'Noto Sans JP', sans-serif;
    }
  </style>
</head>
<body>
  <div id="mock-badge">🧪 モック環境 — 表示データはすべてダミーです</div>
  <div id="root"></div>
  <script src="dist/bundle.js"></script>
</body>
</html>
