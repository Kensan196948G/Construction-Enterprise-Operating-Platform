apiVersion: 1

# Notification policies for cdx-server alerts.
# Routes alerts with label service=cdx-server to the cdx-ops contact point.
#
# Policy tree:
#   root (default) → cdx-ops (cdx-server alerts)
#                  → cdx-webhook (if CDX_ALERT_WEBHOOK_URL is set)
#
# Grafana evaluates the most specific matching policy first.
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/#notification-policies

policies:
  - orgId: 1
    receiver: cdx-ops
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # Route all cdx-server service alerts to the cdx-ops contact point
      - receiver: cdx-ops
        matchers:
          - label: service
            match: =
            value: cdx-server
        group_by:
          - alertname
          - severity
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 4h
        continue: true # also evaluate subsequent routes

      # Additionally route critical alerts to webhook (if configured)
      - receiver: cdx-webhook
        matchers:
          - label: service
            match: =
            value: cdx-server
          - label: severity
            match: =
            value: critical
        group_by:
          - alertname
        group_wait: 10s
        group_interval: 2m
        repeat_interval: 1h
