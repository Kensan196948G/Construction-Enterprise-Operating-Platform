[project]
name = "knowledge-service"
version = "0.0.1"
description = "Sprint 2 Knowledge service for Synapse-OS (BL-011). Document/AI Action Lineage Graph + Retention. SERVICE_RESPONSIBILITY_MODEL: Knowledge は Graph/Lineage/Retention のみを持ち、DLP 最終判断は Policy Service に委譲する。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "synapse-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["knowledge_app*"]
