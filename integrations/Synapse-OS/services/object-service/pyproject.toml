[project]
name = "object-service"
version = "0.0.1"
description = "Sprint 1 Issue (Enterprise Object) service for Synapse-OS (BL-002)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "synapse-shared",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
postgres = [
    "psycopg2-binary>=2.9,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["object_app*"]
