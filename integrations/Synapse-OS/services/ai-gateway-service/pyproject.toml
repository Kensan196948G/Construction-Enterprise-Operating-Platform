[project]
name = "ai-gateway-service"
version = "0.0.1"
description = "Sprint 2 AI Gateway service for Synapse-OS (BL-006). Direct AI Access禁止 (ADR-001) を実装で固定する唯一の経路。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "anthropic>=0.25,<1",
    "synapse-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_gateway_app*"]
