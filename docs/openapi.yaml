openapi: "3.1.0"
info:
  title: Construction Enterprise Operating Platform API
  version: "0.6.1"
  description: Unified enterprise operating platform for construction company governance, business portal, field OS, and AI governance.
  contact:
    name: Platform Team
  license:
    name: Proprietary
servers:
  - 
    url: "http://localhost:3000"
    description: Local development
  - 
    url: "http://localhost:8080"
    description: Docker compose
tags:
  - 
    name: System
    description: Health and metadata endpoints
  - 
    name: Auth
    description: JWT token issuance
  - 
    name: Dashboard
    description: Governance dashboard
  - 
    name: Organizations
    description: Organization management
  - 
    name: Users
    description: User management
  - 
    name: Roles
    description: Role management
  - 
    name: Devices
    description: Field device management
  - 
    name: Applications
    description: Application registry
  - 
    name: Governance
    description: Policy engine, audit log, ABAC evaluation
  - 
    name: Workflows
    description: Workflow templates and CRUD
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
        - System
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      operationId: getReady
      summary: Readiness probe (verifies persistence tier)
      tags:
        - System
      responses:
        200:
          description: Persistence tier responds
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - storage
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                  storage:
                    type: string
                  timestamp:
                    type: string
        503:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Platform version and metadata
      tags:
        - System
      responses:
        200:
          description: Platform info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  nodeVersion:
                    type: string
  /api/v1/auth/token:
    post:
      operationId: issueToken
      summary: Issue a JWT from an API key credential
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  example: "keyId:rawSecret"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        429:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke the caller's current JWT (logout)
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
                    example: true
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
