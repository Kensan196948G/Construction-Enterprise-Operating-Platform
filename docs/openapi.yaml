              type: object
              required:
                - organizationId
                - displayName
                - email
              properties:
                organizationId:
                  type: string
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                status:
                  type: string
                  enum:
                    - invited
                    - active
                    - suspended
                    - deactivated
                roleIds:
                  type: array
                  items:
                    type: string
      responses:
