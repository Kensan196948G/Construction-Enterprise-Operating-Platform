        minimum: 1
        maximum: 200
      description: Number of items per page
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID
    keyIdPath:
      name: keyId
      in: path
      required: true
      schema:
        type: string
      description: API key ID
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "API key in the format `keyId:rawSecret`. The server validates via HMAC-SHA256 and constant-time comparison."
      bearerFormat: "keyId:rawSecret"
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT issued by POST /api/v1/auth/token. Include in Authorization header.
