components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
        - count
        - total
        - limit
        - offset
      properties:
        count:
          type: integer
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Organization:
      type: object
      required:
        - id
        - name
        - type
        - status
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - headquarters
            - branch
            - site
            - partner
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
        parentId:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      required:
        - id
        - organizationId
        - displayName
        - email
        - status
        - roleIds
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
            - deactivated
        roleIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required:
        - id
        - name
        - scope
        - permissions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
            - global
            - organization
            - site
        permissions:
          type: array
          items:
            type: string
    Device:
      type: object
      required:
        - id
        - organizationId
        - kind
        - status
      properties:
        id:
          type: string
        organizationId:
          type: string
        kind:
          type: string
          enum:
            - phone
            - tablet
            - laptop
            - kiosk
            - sensor
            - camera
            - other
        status:
          type: string
          enum:
            - active
            - inactive
            - maintenance
            - decommissioned
    Application:
      type: object
      required:
        - id
        - key
        - name
        - category
        - health
        - ownerOrganizationId
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
            - governance
            - field
            - portal
            - workflow
            - document
            - security
        health:
          type: string
          enum:
            - healthy
            - degraded
            - unavailable
        ownerOrganizationId:
          type: string
    Policy:
      type: object
      required:
        - id
        - name
        - effect
        - actions
        - resources
      properties:
        id:
          type: string
        name:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        actions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    Workflow:
      type: object
      required:
        - id
        - name
        - type
        - status
        - steps
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - approval
            - onboarding
            - procurement
            - inspection
            - incident
        status:
          type: string
          enum:
            - draft
            - active
            - suspended
            - archived
        steps:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - requiredPermission
            properties:
              key:
                type: string
              name:
                type: string
              requiredPermission:
                type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditEntry:
      type: object
      required:
        - id
        - at
        - actor
        - action
        - resource
        - outcome
        - hash
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum:
            - success
            - failure
            - denied
        hash:
          type: string
          description: SHA-256 of previous entry hash + this entry (tamper-evident chain)
        metadata:
          type: object
          additionalProperties:
            type: string
    TokenResponse:
      type: object
      required:
        - token
        - expiresIn
        - subject
      properties:
        token:
          type: string
          description: HS256 JWT
        expiresIn:
          type: integer
          description: Seconds until expiry
        subject:
          type: string
          description: Authenticated subject
        organizationId:
          type: string
          description: Organization scope when the credential is org-scoped; absent for global credentials
  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "API key in the format `keyId:rawSecret`. The server validates via HMAC-SHA256 and constant-time comparison."
      bearerFormat: "keyId:rawSecret"
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT issued by POST /api/v1/auth/token. Include in Authorization header.
