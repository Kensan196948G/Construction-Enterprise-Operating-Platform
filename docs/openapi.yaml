        - originalName
        - contentType
        - fileSize
        - objectKey
        - category
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        fileName:
          type: string
        originalName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        objectKey:
          type: string
        category:
          type: string
          enum:
            - general
            - progress
            - safety
            - quality
            - handover
        caption:
          type: string
        takenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SafetyCheck:
