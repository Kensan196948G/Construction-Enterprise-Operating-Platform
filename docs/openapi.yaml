openapi: "3.1.0"
info:
  title: Construction Enterprise Operating Platform API
  version: "0.14.1"
  description: Unified enterprise operating platform for construction company governance, business portal, field OS, and AI governance.
  contact:
    name: Platform Team
  license:
    name: Proprietary
servers:
  - 
    url: "http://localhost:3000"
    description: Local development
  - 
    url: "http://localhost:8080"
    description: Docker compose
  - 
    url: "https://ceop.mirai-dx-platform.com"
    description: Production
tags:
  - 
    name: System
    description: Health and metadata endpoints
  - 
    name: Auth
    description: JWT token issuance
  - 
    name: Dashboard
    description: Governance dashboard
  - 
    name: Organizations
    description: Organization management
  - 
    name: Users
    description: User management
  - 
    name: Roles
    description: Role management
  - 
    name: Devices
    description: Field device management
  - 
    name: Applications
    description: Application registry
  - 
    name: Governance
    description: Policy engine, audit log, ABAC evaluation
  - 
    name: Workflows
    description: Workflow templates and CRUD
  - 
    name: WorkflowInstances
    description: Workflow instance runs (Issue→Approval→Audit)
  - 
    name: AiGovernance
    description: AI action governance (integration Y-09)
  - 
    name: Photos
    description: Photo/document metadata (ServiceHub S-03)
  - 
    name: SafetyChecks
    description: Safety checks (ServiceHub S-04)
  - 
    name: QualityInspections
    description: Quality inspections (ServiceHub S-04)
  - 
    name: CostRecords
    description: Cost records and work hours (ServiceHub S-05)
  - 
    name: Notifications
    description: Notification deliveries (ServiceHub S-09)
  - 
    name: Knowledge
    description: Knowledge articles (ServiceHub S-06)
  - 
    name: Contracts
    description: Legal contracts (ServiceHub S-07)
  - 
    name: Itsm
    description: ITSM adapter (ServiceHub S-08)
  - 
    name: Documents
    description: Drawings/documents (Enterprise-OS E-03)
  - 
    name: WorkSchedules
    description: Site work schedules (Enterprise-OS E-02)
  - 
    name: PurchaseOrders
    description: Purchase orders / ERP (Enterprise-OS E-05)
  - 
    name: Compliance
    description: Compliance checks (ServiceHub S-07)
  - 
    name: LegalEvidence
    description: Legal evidence timeline (ServiceHub S-07)
  - 
    name: Projects
    description: Construction project management (ServiceHub S-01)
  - 
    name: DailyReports
    description: Site daily reports (ServiceHub S-02)
  - 
    name: WorkOrders
    description: Site work orders (Civil-Construction-Management-Platform)
  - 
    name: Inspections
    description: Site inspections (Civil-Construction-Management-Platform)
  - 
    name: Suppliers
    description: Supplier evaluations (Civil-Construction-Management-Platform)
  - 
    name: QualityObjectives
    description: Quality objectives (Civil-Construction-Management-Platform)
  - 
    name: Risks
    description: Risk register (Civil-Construction-Management-Platform)
  - 
    name: ManagementReviews
    description: Management reviews (Civil-Construction-Management-Platform)
  - 
    name: AiBuildProjects
    description: AI build projects (Civil-Construction-AI-Build-Platform)
  - 
    name: DxProjects
    description: DX project portfolio (DX-Project-Portfolio-Atlas)
  - 
    name: MaterialPhotoLogs
    description: Material photo logs (Civil-Material-Photo-Logger)
  - 
    name: IntegrationGateway
    description: CEOP gateway reverse proxy for integration services (P1)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
        - System
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      operationId: getReady
      summary: Readiness probe (verifies persistence tier)
      tags:
        - System
      responses:
        200:
          description: Persistence tier responds
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - storage
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                  storage:
                    type: string
                  timestamp:
                    type: string
        503:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Platform version and metadata
      tags:
        - System
      responses:
        200:
          description: Platform info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                    description: NODE_ENV at runtime
                  nodeVersion:
                    type: string
  /api/v1/auth/token:
    post:
      operationId: issueToken
      summary: Issue a JWT from an API key credential
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  example: "keyId:rawSecret"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        429:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke the caller's current JWT (logout)
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
                    example: true
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/keys:
    get:
      operationId: listApiKeys
      summary: "List API key metadata (requires auth:write, platform-level credential)"
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthKey"
                    description: Key metadata only — the secret hash is never exposed
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: "Revoke an API key (requires auth:write, platform-level credential)"
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          $ref: "#/components/parameters/keyIdPath"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                  - keyId
                properties:
                  revoked:
                    type: boolean
                    example: true
                  keyId:
                    type: string
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/dashboard:
    get:
      operationId: getDashboard
      summary: Role-filtered governance dashboard
      tags:
        - Dashboard
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: Dashboard view filtered by caller permissions
          content:
            application/json:
              schema:
                type: object
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: Paginated list of organizations
      tags:
        - Organizations
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          $ref: "#/components/parameters/limitParam"
        - 
          $ref: "#/components/parameters/offsetParam"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - organizations
                  - count
                  - total
                  - limit
                  - offset
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  count:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrganization
      summary: Create an organization
      tags:
        - Organizations
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - headquarters
                    - branch
                    - site
                    - partner
                parentId:
                  type: string
                  description: Required for non-headquarters types
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - archived
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
