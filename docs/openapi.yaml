                type:
                  type: string
                  enum:
                    - headquarters
                    - branch
                    - site
                    - partner
                parentId:
                  type: string
                  description: Required for non-headquarters types
                status:
                  type: string
                  enum:
                    - active
                    - inactive
                    - suspended
      responses:
        201:
