      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          $ref: "#/components/parameters/idPath"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
