openapi: "3.1.0"
info:
  title: Construction Enterprise Operating Platform API
  version: "0.9.0"
  description: Unified enterprise operating platform for construction company governance, business portal, field OS, and AI governance.
  contact:
    name: Platform Team
  license:
    name: Proprietary
servers:
  - 
    url: "http://localhost:3000"
    description: Local development
  - 
    url: "http://localhost:8080"
    description: Docker compose
  - 
    url: "https://ceop.mirai-dx-platform.com"
    description: Production
tags:
  - 
    name: System
    description: Health and metadata endpoints
  - 
    name: Auth
    description: JWT token issuance
  - 
    name: Dashboard
    description: Governance dashboard
  - 
    name: Organizations
    description: Organization management
  - 
    name: Users
    description: User management
  - 
    name: Roles
    description: Role management
  - 
    name: Devices
    description: Field device management
  - 
    name: Applications
    description: Application registry
  - 
    name: Governance
    description: Policy engine, audit log, ABAC evaluation
  - 
    name: Workflows
    description: Workflow templates and CRUD
  - 
    name: WorkflowInstances
    description: Workflow instance runs (Issue→Approval→Audit)
  - 
    name: AiGovernance
    description: AI action governance (integration Y-09)
  - 
    name: Photos
    description: Photo/document metadata (ServiceHub S-03)
  - 
    name: SafetyChecks
    description: Safety checks (ServiceHub S-04)
  - 
    name: QualityInspections
    description: Quality inspections (ServiceHub S-04)
  - 
    name: CostRecords
    description: Cost records and work hours (ServiceHub S-05)
  - 
    name: Notifications
    description: Notification deliveries (ServiceHub S-09)
  - 
    name: Projects
    description: Construction project management (ServiceHub S-01)
  - 
    name: DailyReports
    description: Site daily reports (ServiceHub S-02)
  - 
    name: IntegrationGateway
    description: CEOP gateway reverse proxy for integration services (P1)
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe
      tags:
        - System
      responses:
        200:
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /health/ready:
    get:
      operationId: getReady
      summary: Readiness probe (verifies persistence tier)
      tags:
        - System
      responses:
        200:
          description: Persistence tier responds
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - storage
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ready
                  storage:
                    type: string
                  timestamp:
                    type: string
        503:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/info:
    get:
      operationId: getInfo
      summary: Platform version and metadata
      tags:
        - System
      responses:
        200:
          description: Platform info
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  version:
                    type: string
                  environment:
                    type: string
                    description: NODE_ENV at runtime
                  nodeVersion:
                    type: string
  /api/v1/auth/token:
    post:
      operationId: issueToken
      summary: Issue a JWT from an API key credential
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - credential
              properties:
                credential:
                  type: string
                  example: "keyId:rawSecret"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        429:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke the caller's current JWT (logout)
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                properties:
                  revoked:
                    type: boolean
                    example: true
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/keys:
    get:
      operationId: listApiKeys
      summary: "List API key metadata (requires auth:write, platform-level credential)"
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthKey"
                    description: Key metadata only — the secret hash is never exposed
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/auth/keys/{keyId}:
    delete:
      operationId: revokeApiKey
      summary: "Revoke an API key (requires auth:write, platform-level credential)"
      tags:
        - Auth
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          $ref: "#/components/parameters/keyIdPath"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - revoked
                  - keyId
                properties:
                  revoked:
                    type: boolean
                    example: true
                  keyId:
                    type: string
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: Not Found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
