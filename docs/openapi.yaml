  /api/v1/governance/audit:
    get:
      operationId: getAuditLog
      summary: "Retrieve recent audit log entries (requires audit:read)"
      description: Organization-scoped credentials receive only entries attributed to their own organization; globally-scoped credentials receive the whole chain. Entries recorded before tenant attribution existed carry no organization and are withheld from scoped credentials.
      tags:
        - Governance
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
          description: Maximum number of recent entries to return
        - 
          name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of most-recent entries to skip
      responses:
        200:
          description: Audit entries
          content:
            application/json:
              schema:
                type: object
                required:
                  - entries
                  - count
                  - total
                  - limit
                  - offset
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  count:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
