components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
        - count
        - total
        - limit
        - offset
      properties:
        count:
          type: integer
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Organization:
      type: object
      required:
        - id
        - name
        - type
        - status
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - headquarters
            - branch
            - site
            - partner
        status:
          type: string
          enum:
            - active
            - suspended
            - archived
        parentId:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      required:
        - id
        - organizationId
        - displayName
        - email
        - status
        - roleIds
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
            - deactivated
        roleIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required:
        - id
        - name
        - scope
        - permissions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
            - global
            - organization
            - site
        permissions:
          type: array
          items:
            type: string
    Device:
      type: object
      required:
        - id
        - organizationId
        - kind
        - status
      properties:
        id:
          type: string
        organizationId:
          type: string
        kind:
          type: string
          enum:
            - tablet
            - phone
            - kiosk
            - sensor
            - laptop
        status:
          type: string
          enum:
            - provisioned
            - active
            - lost
            - retired
        assignedUserId:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    Application:
      type: object
      required:
        - id
        - key
        - name
        - category
        - health
        - ownerOrganizationId
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
            - portal
            - governance
            - field
            - workflow
            - document
        health:
          type: string
          enum:
            - healthy
            - degraded
            - down
            - unknown
        ownerOrganizationId:
          type: string
    Policy:
      type: object
      required:
        - id
        - name
        - effect
        - actions
        - resources
      properties:
        id:
          type: string
        name:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        actions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    Workflow:
      type: object
      required:
        - id
        - name
        - type
        - status
        - steps
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - approval
            - notification
            - task
        status:
          type: string
          enum:
            - draft
            - active
            - suspended
            - retired
        steps:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - requiredPermission
            properties:
              key:
                type: string
              name:
                type: string
              requiredPermission:
                type: string
    WorkflowInstance:
      type: object
      required:
        - id
        - workflowId
        - organizationId
        - subject
        - stepKey
        - stepName
        - status
        - requestedAt
      properties:
        id:
          type: string
        workflowId:
          type: string
        organizationId:
          type: string
        subject:
          type: string
        stepKey:
          type: string
        stepName:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decision:
          type: string
          enum:
            - approve
            - reject
        comment:
          type: string
    AiAction:
      type: object
      required:
        - id
        - requester
        - model
        - purpose
        - promptHash
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        requester:
          type: string
        organizationId:
          type: string
        model:
          type: string
        purpose:
          type: string
        promptHash:
          type: string
          description: SHA-256 hex of the prompt payload
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        decisionNote:
          type: string
    Project:
      type: object
      required:
        - id
        - organizationId
        - projectCode
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectCode:
          type: string
        name:
          type: string
        description:
          type: string
        clientName:
          type: string
        siteAddress:
          type: string
        status:
          type: string
          enum:
            - planning
            - in_progress
            - completed
            - suspended
            - cancelled
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budget:
          type: number
        managerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DailyReport:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - reportDate
        - workerCount
        - safetyCheck
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        reportDate:
          type: string
          format: date
        weather:
          type: string
          enum:
            - sunny
            - cloudy
            - rainy
            - snowy
        temperature:
          type: integer
        workerCount:
          type: integer
        workContent:
          type: string
        safetyCheck:
          type: boolean
        safetyNotes:
          type: string
        progressRate:
          type: integer
        issues:
          type: string
        status:
          type: string
          enum:
            - draft
            - submitted
            - approved
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Photo:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - fileName
        - originalName
        - contentType
        - fileSize
        - objectKey
        - category
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        fileName:
          type: string
        originalName:
          type: string
        contentType:
          type: string
        fileSize:
          type: integer
        objectKey:
          type: string
        category:
          type: string
          enum:
            - general
            - progress
            - safety
            - quality
            - handover
        caption:
          type: string
        takenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SafetyCheck:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - checkDate
        - checkType
        - itemsTotal
        - itemsOk
        - itemsNg
        - overallResult
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        checkDate:
          type: string
          format: date
        checkType:
          type: string
          enum:
            - daily
            - patrol
            - ky
            - other
        itemsTotal:
          type: integer
        itemsOk:
          type: integer
        itemsNg:
          type: integer
        overallResult:
          type: string
          enum:
            - pending
            - ok
            - ng
        notes:
          type: string
        inspectorId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QualityInspection:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - inspectionDate
        - inspectionType
        - targetItem
        - result
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        inspectionDate:
          type: string
          format: date
        inspectionType:
          type: string
        targetItem:
          type: string
        standardValue:
          type: string
        measuredValue:
          type: string
        result:
          type: string
          enum:
            - pending
            - pass
            - fail
        notes:
          type: string
        inspectorId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CostRecord:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - recordDate
        - category
        - description
        - budgetedAmount
        - actualAmount
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        recordDate:
          type: string
          format: date
        category:
          type: string
        description:
          type: string
        budgetedAmount:
          type: number
        actualAmount:
          type: number
        vendorName:
          type: string
        invoiceNumber:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    WorkHour:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - workDate
        - hours
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        workerId:
          type: string
        workDate:
          type: string
          format: date
        hours:
          type: number
        workType:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    NotificationDelivery:
      type: object
      required:
        - id
        - userId
        - eventKey
        - channel
        - status
        - attempts
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        eventKey:
          type: string
        channel:
          type: string
          enum:
            - email
            - slack
            - webhook
        status:
          type: string
          enum:
            - pending
            - sent
            - failed
            - retry
        subject:
          type: string
        bodyPreview:
          type: string
        errorDetail:
          type: string
        failureKind:
          type: string
        attempts:
          type: integer
        sentAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AuditEntry:
      type: object
      required:
        - id
        - at
        - actor
        - action
        - resource
        - outcome
        - hash
      properties:
        id:
          type: string
        at:
          type: string
          format: date-time
        actor:
          type: string
        action:
          type: string
        resource:
          type: string
        outcome:
          type: string
          enum:
            - success
            - failure
            - denied
        hash:
          type: string
          description: SHA-256 of previous entry hash + this entry (tamper-evident chain)
        metadata:
          type: object
          additionalProperties:
            type: string
    TokenResponse:
      type: object
      required:
        - token
        - expiresIn
        - subject
      properties:
        token:
          type: string
          description: HS256 JWT
        expiresIn:
          type: integer
          description: Seconds until expiry
        subject:
          type: string
          description: Authenticated subject
        organizationId:
          type: string
          description: Organization scope when the credential is org-scoped; absent for global credentials
    AuthKey:
      type: object
      required:
        - keyId
        - subject
        - permissions
      properties:
        keyId:
          type: string
          description: "Credential identifier used in `keyId:secret`"
        subject:
          type: string
          description: Subject the key authenticates as
        permissions:
          type: array
          items:
            type: string
          description: Granted permissions
        organizationId:
          type: string
          description: Organization scope; absent for platform-level credentials
        createdAt:
          type: string
          format: date-time
          description: Provisioning time (SQLite mode)
      description: API key metadata. The secret hash is never returned.
  parameters:
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 200
      description: Number of items per page
    offsetParam:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
        minimum: 0
      description: Number of items to skip
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource ID
    keyIdPath:
      name: keyId
      in: path
      required: true
      schema:
        type: string
      description: API key ID
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "API key in the format `keyId:rawSecret`. The server validates via HMAC-SHA256 and constant-time comparison."
      bearerFormat: "keyId:rawSecret"
    BearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT issued by POST /api/v1/auth/token. Include in Authorization header.
