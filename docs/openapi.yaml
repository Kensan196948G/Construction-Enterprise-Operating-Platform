            - ky
            - other
        itemsTotal:
          type: integer
        itemsOk:
          type: integer
        itemsNg:
          type: integer
        overallResult:
          type: string
          enum:
            - pending
            - ok
            - ng
        notes:
          type: string
        inspectorId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    QualityInspection:
      type: object
      required:
        - id
        - organizationId
        - projectId
        - inspectionDate
        - inspectionType
        - targetItem
        - result
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectId:
          type: string
        inspectionDate:
          type: string
          format: date
        inspectionType:
          type: string
        targetItem:
          type: string
        standardValue:
          type: string
        measuredValue:
          type: string
        result:
          type: string
          enum:
            - pending
