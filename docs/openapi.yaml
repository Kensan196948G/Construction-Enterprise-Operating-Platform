components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PaginationMeta:
      type: object
      required:
        - count
        - total
        - limit
        - offset
      properties:
        count:
          type: integer
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    Organization:
      type: object
      required:
        - id
        - name
        - type
        - status
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - headquarters
            - branch
            - site
            - partner
        status:
          type: string
          enum:
            - active
            - suspended
            - archived
        parentId:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      required:
        - id
        - organizationId
        - displayName
        - email
        - status
        - roleIds
        - createdAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
            - invited
            - active
            - suspended
            - deactivated
        roleIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
    Role:
      type: object
      required:
        - id
        - name
        - scope
        - permissions
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        scope:
          type: string
          enum:
            - global
            - organization
            - site
        permissions:
          type: array
          items:
            type: string
    Device:
      type: object
      required:
        - id
        - organizationId
        - kind
        - status
      properties:
        id:
          type: string
        organizationId:
          type: string
        kind:
          type: string
          enum:
            - tablet
            - phone
            - kiosk
            - sensor
            - laptop
        status:
          type: string
          enum:
            - provisioned
            - active
            - lost
            - retired
        assignedUserId:
          type: string
        lastSeenAt:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
    Application:
      type: object
      required:
        - id
        - key
        - name
        - category
        - health
        - ownerOrganizationId
      properties:
        id:
          type: string
        key:
          type: string
        name:
          type: string
        category:
          type: string
          enum:
            - portal
            - governance
            - field
            - workflow
            - document
        health:
          type: string
          enum:
            - healthy
            - degraded
            - down
            - unknown
        ownerOrganizationId:
          type: string
    Policy:
      type: object
      required:
        - id
        - name
        - effect
        - actions
        - resources
      properties:
        id:
          type: string
        name:
          type: string
        effect:
          type: string
          enum:
            - allow
            - deny
        actions:
          type: array
          items:
            type: string
        resources:
          type: array
          items:
            type: string
    Workflow:
      type: object
      required:
        - id
        - name
        - type
        - status
        - steps
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - approval
            - notification
            - task
        status:
          type: string
          enum:
            - draft
            - active
            - suspended
            - retired
        steps:
          type: array
          items:
            type: object
            required:
              - key
              - name
              - requiredPermission
            properties:
              key:
                type: string
              name:
                type: string
              requiredPermission:
                type: string
    WorkflowInstance:
      type: object
      required:
        - id
        - workflowId
        - organizationId
        - subject
        - stepKey
        - stepName
        - status
        - requestedAt
      properties:
        id:
          type: string
        workflowId:
          type: string
        organizationId:
          type: string
        subject:
          type: string
        stepKey:
          type: string
        stepName:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        requestedAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decision:
          type: string
          enum:
            - approve
            - reject
        comment:
          type: string
    AiAction:
      type: object
      required:
        - id
        - requester
        - model
        - purpose
        - promptHash
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        requester:
          type: string
        organizationId:
          type: string
        model:
          type: string
        purpose:
          type: string
        promptHash:
          type: string
          description: SHA-256 hex of the prompt payload
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        decidedBy:
          type: string
        decidedAt:
          type: string
          format: date-time
        decisionNote:
          type: string
    Project:
      type: object
      required:
        - id
        - organizationId
        - projectCode
        - name
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        organizationId:
          type: string
        projectCode:
          type: string
        name:
          type: string
        description:
          type: string
        clientName:
          type: string
        siteAddress:
          type: string
        status:
          type: string
          enum:
            - planning
            - in_progress
            - completed
            - suspended
            - cancelled
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        budget:
          type: number
        managerId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
