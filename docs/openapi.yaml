      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - organizations
                  - count
                  - total
                  - limit
                  - offset
                properties:
                  organizations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Organization"
                  count:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrganization
      summary: Create an organization
      tags:
        - Organizations
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - headquarters
                    - branch
                    - site
                    - partner
                parentId:
                  type: string
                  description: Required for non-headquarters types
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - archived
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
