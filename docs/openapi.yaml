    post:
      operationId: createOrganization
      summary: Create an organization
      tags:
        - Organizations
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - type
              properties:
                name:
                  type: string
                type:
                  type: string
                  enum:
                    - headquarters
                    - branch
                    - site
                    - partner
                parentId:
                  type: string
                  description: Required for non-headquarters types
                status:
                  type: string
                  enum:
                    - active
                    - suspended
                    - archived
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        400:
          description: Bad Request
          content:
