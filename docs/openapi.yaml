      operationId: listNotifications
      summary: Paginated list of notification deliveries (optional ?status=)
      tags:
        - Notifications
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      parameters:
        - 
          $ref: "#/components/parameters/limitParam"
        - 
          $ref: "#/components/parameters/offsetParam"
        - 
          name: status
          in: query
          schema:
            type: string
            enum:
              - pending
              - sent
              - failed
              - retry
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - notifications
                  - count
                  - total
                  - limit
                  - offset
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: "#/components/schemas/NotificationDelivery"
                  count:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createNotification
      summary: Create a notification delivery intent (S-09)
      tags:
        - Notifications
      security:
        - 
          ApiKeyAuth: []
        - 
          BearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - eventKey
                - channel
              properties:
                organizationId:
                  type: string
                userId:
                  type: string
                eventKey:
                  type: string
                channel:
                  type: string
                  enum:
                    - email
                    - slack
                    - webhook
                subject:
                  type: string
                bodyPreview:
                  type: string
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - notification
                properties:
                  notification:
                    $ref: "#/components/schemas/NotificationDelivery"
        400:
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/v1/notifications/{id}:
    get:
      operationId: getNotification
      summary: Notification delivery detail
      tags:
