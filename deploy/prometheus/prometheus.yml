# CEOP Prometheus scrape configuration (P4).
# Scrapes the platform /metrics endpoint on the loopback port.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: ceop
    metrics_path: /metrics
    scheme: http
    # CEOP_METRICS_TOKEN（v0.11.3 以降 production で必須）。トークンは Git に
    # コミットせず、ホストの /home/kensan/.ceop/ceop-metrics-token に配置し、
    # docker-compose.prod.yml が /secrets/ceop-metrics-token として読取専用で
    # マウントする。値は .env の CEOP_METRICS_TOKEN と同一にすること。
    authorization:
      type: Bearer
      credentials_file: /secrets/ceop-metrics-token
    static_configs:
      - targets: ["127.0.0.1:3120"]
        labels:
          app: ceop-platform
