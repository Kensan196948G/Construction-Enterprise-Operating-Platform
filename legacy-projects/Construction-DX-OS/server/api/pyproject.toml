[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdx-server"
version = "0.1.0"
description = "Construction DX OS central platform API server (FastAPI + async PostgreSQL + Prometheus + Grafana)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Construction DX OS Team" }]
keywords = ["construction", "dx", "fastapi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.27",
    "prometheus-client>=0.20",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # CVE-2024-56326/CVE-2024-56201 fixed in 3.1.5; CVE-2025-27516 fixed in 3.1.6
    "jinja2>=3.1.6",
    # CVE-2026-32597 fixed in 2.12.0 — require 2.12.1+
    "PyJWT>=2.12.1",
    "cryptography>=40",
    # CVE-2024-53981/CVE-2026-24486/CVE-2026-40347/CVE-2026-42561 fixed in 0.0.27+
    "python-multipart>=0.0.27",
    # Phase 9: async storage layer (Issue #4)
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    # Phase 2 / Issue 0023 Phase E: SSE log streaming
    "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "pytest-benchmark>=4",
    "httpx>=0.27",
    "respx>=0.21",
    "ruff>=0.6",
    "psycopg2-binary>=2.9",
    "fakeredis>=2.23",
    "lupa>=2.0",
]
# SQLite-based PostgresStorage tests (no Postgres required)
test-pg-sqlite = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
# Redis-backed rate limiter (Phase 4b)
redis-backend = [
    "redis>=5",
]
# Serial-number OCR pipeline — iPhone → GMSV0002 SMB → easyocr
# easyocr pulls PyTorch (~500MB); install only on production hosts that run OCR.
# pillow-heif enables HEIC (iPhone default format); pre-built manylinux wheels
# bundle libheif so no system package is required.
ocr = [
    "easyocr>=1.7",
    "pillow-heif>=0.16",
]

[project.scripts]
cdx-server = "cdx_server.__main__:main"

[tool.setuptools.packages.find]
include = ["cdx_server*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Contract tests under tests/contract/ import cdx_agent for end-to-end flow.
pythonpath = [".", "../../agent/cdx_agent"]
# Suppress third-party deprecation warnings that are not actionable in our code.
# uvicorn uses websockets.legacy internally (Issue 0015).
# aiosqlite closes its connection in a thread after the event loop ends (Issue 0034).
filterwarnings = [
    "ignore::DeprecationWarning:websockets",
    "ignore::DeprecationWarning:uvicorn",
    "ignore::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
source = ["cdx_server"]
omit = ["cdx_server/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B011"]
# FastAPI's Depends() default-argument idiom is fine — the framework relies on it.
"cdx_server/routers/**/*.py" = ["B008"]
"cdx_server/admin_auth.py" = ["B008"]
"cdx_server/oidc_auth.py" = ["B008"]
