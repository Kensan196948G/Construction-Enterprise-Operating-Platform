[project]
name = "federation-service"
version = "0.0.1"
description = "Sprint 2 Federation service for Synapse-OS (BL-008). ADR-002 'Cross Tenant 操作は通常 Object 更新ではなく Federation Event' を実装で固定する唯一の経路。"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn>=0.29,<1",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "synapse-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["federation_app*"]
